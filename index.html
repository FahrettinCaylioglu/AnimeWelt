<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeWelt</title>

    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/font.css">
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>
    <section class="faq">
        <div class="faq-title">
            <img src="./assets/icons/question.png" alt="questionmark icon">
            <h2>FAQ</h2>
        </div>
        <div class="faq-wrapper">
            <input type="checkbox" class="arrow-box" id="arrow-box-1">
            <div class="faq-section">
                <label class="faq-question" for="arrow-box-1">
                    <h4>What questions do you have?</h4>
                    <span class="arrow-icon">
                        <img src="assets/icons/arrow_forward.png">
                    </span>
                </label>
            </div>
            <div class="answer-section">
                I don't have any, I need just help
            </div>
        </div>
    </section>
    <section class="contact-form-wrapper">
        <div class="contact-form-title">
            <img src="./assets/icons/question.png" alt="">
            <h2>Contact Form</h2>
        </div>
        <p class="contact-text">
            Have a question or an idea to collaborate?<br>
            Get in touch—I’d love to hear from you and explore how we can work together.
        </p>
    </section>
    <footer class="footer">
        <div class="footer-log-imp">
            <div class="footer-logo">
                <!--<picture>
                <source media="(min-width: 800px)" srcset=""> </picture>-->
                <img src="./assets/icons/copyright.png" alt="Icon Anime Welt">
                <div>Anime Welt 2026</div>
            </div>
            <div class="footer-impressum">
                <p>Imprint</p>
                <p>Cookie Preferences</p>
            </div>
        </div>
        <div class="footer-social-media">
            <a href="https://www.tiktok.com/" target="_blank">
                <img src="./assets/icons/w_tiktok.png" alt="Tiktok Icon"></a>
            <a href="https://www.youtube.com/" target="_blank">
                <img src="./assets/icons/w_youtube.png" alt="Youtube Icon"></a>
            <a href="https://www.facebook.com/" target="_blank">
                <img src="./assets/icons/w_facebook.png" alt="Facebook Icon"></a>
            <a href="https://www.instagram.com/" target="_blank">
                <img src="./assets/icons/w_instagram.png" alt="Instagram Icon"></a>
        </div>
    </footer>
</body>

</html>
